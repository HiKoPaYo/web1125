<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입체도형 접기 놀이</title>
<style>
  :root {
    --bg: #fbf7f0; --card: #ffffff; --ink: #2b2a33; --muted: #6f6c7a;
    --line: #e7e1d6; --accent: #ff7a59; --accent-ink: #ffffff; --chip: #f3eee5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b22; --card: #26252e; --ink: #f1eff6; --muted: #a9a6b4;
      --line: #3a3843; --accent: #ff8c6e; --accent-ink: #1c1b22; --chip: #302f39;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b22; --card: #26252e; --ink: #f1eff6; --muted: #a9a6b4;
    --line: #3a3843; --accent: #ff8c6e; --accent-ink: #1c1b22; --chip: #302f39;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font: inherit; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .stage {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; position: relative;
  }
  canvas { display: block; width: 100%; height: 380px; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hint { position: absolute; right: 12px; top: 10px; font-size: .8rem; color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; min-width: 96px;
  }
  .btn.ghost { background: var(--chip); color: var(--ink); border: 1px solid var(--line); font-weight: 500; min-width: 0; }
  input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
  .pct { width: 3.5em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .info { margin-top: 18px; }
  .info p { margin: 0 0 12px; line-height: 1.6; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 8px; text-align: center; cursor: pointer; font: inherit; color: var(--ink);
  }
  .card .lbl { font-size: .9rem; color: var(--muted); }
  .card .num { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
  .card .num.hidden { color: var(--muted); }
  .euler { margin-top: 12px; color: var(--muted); font-size: .95rem; text-align: center; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>입체도형 접기 놀이</h1>
  <p class="sub">전개도를 접으면 어떤 입체도형이 될까요? 도형을 고르고 접어 보세요.</p>

  <div class="chips" id="chips"></div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hint">드래그해서 돌려 보기</div>
    <div class="controls">
      <button class="btn" id="play">접기</button>
      <input type="range" id="fold" min="0" max="100" value="0" aria-label="접힌 정도">
      <span class="pct" id="pct">0%</span>
      <button class="btn ghost" id="spin">자동 회전 켬</button>
    </div>
  </div>

  <section class="info">
    <p id="desc"></p>
    <div class="cards">
      <button class="card" data-k="F"><div class="lbl">면</div><div class="num hidden">?</div></button>
      <button class="card" data-k="E"><div class="lbl">모서리</div><div class="num hidden">?</div></button>
      <button class="card" data-k="V"><div class="lbl">꼭짓점</div><div class="num hidden">?</div></button>
    </div>
    <div class="euler" id="euler">카드를 눌러 정답을 확인해 보세요.</div>
  </section>
</main>

<script>
const H = Math.sqrt(3) / 2;
const deg = a => a * Math.PI / 180;

// 전개도: 각 면은 평면 좌표(pts), 부모 면, 경첩 모서리(hinge), 접는 각도(angle)를 가짐
const SHAPES = {
  cube: {
    name: '정육면체', F: 6, E: 12, V: 8,
    desc: '정사각형 6개로 이루어진 도형이에요. 주사위, 각설탕이 정육면체 모양이에요.',
    faces: [
      { id: 'B', pts: [[0,0],[1,0],[1,1],[0,1]] },
      { id: 'L', parent: 'B', hinge: [[0,0],[0,1]], angle: 90, pts: [[-1,0],[0,0],[0,1],[-1,1]] },
      { id: 'R', parent: 'B', hinge: [[1,0],[1,1]], angle: 90, pts: [[1,0],[2,0],[2,1],[1,1]] },
      { id: 'D', parent: 'B', hinge: [[0,0],[1,0]], angle: 90, pts: [[0,-1],[1,-1],[1,0],[0,0]] },
      { id: 'U', parent: 'B', hinge: [[0,1],[1,1]], angle: 90, pts: [[0,1],[1,1],[1,2],[0,2]] },
      { id: 'T', parent: 'U', hinge: [[0,2],[1,2]], angle: 90, pts: [[0,2],[1,2],[1,3],[0,3]] },
    ]
  },
  tetra: {
    name: '삼각뿔', F: 4, E: 6, V: 4,
    desc: '정삼각형 4개로 만든 삼각뿔(정사면체)이에요. 면이 가장 적은 입체도형이에요.',
    faces: [
      { id: 'B', pts: [[0,0],[1,0],[0.5,H]] },
      { id: 'a', parent: 'B', hinge: [[0,0],[1,0]], angle: 109.47, pts: [[0,0],[1,0],[0.5,-H]] },
      { id: 'b', parent: 'B', hinge: [[1,0],[0.5,H]], angle: 109.47, pts: [[1,0],[1.5,H],[0.5,H]] },
      { id: 'c', parent: 'B', hinge: [[0.5,H],[0,0]], angle: 109.47, pts: [[0.5,H],[-0.5,H],[0,0]] },
    ]
  },
  pyramid: {
    name: '사각뿔', F: 5, E: 8, V: 5,
    desc: '밑면은 사각형, 옆면은 삼각형 4개예요. 피라미드가 사각뿔 모양이에요.',
    faces: [
      { id: 'B', pts: [[0,0],[1,0],[1,1],[0,1]] },
      { id: 'd', parent: 'B', hinge: [[0,0],[1,0]], angle: 125.26, pts: [[0,0],[1,0],[0.5,-H]] },
      { id: 'u', parent: 'B', hinge: [[0,1],[1,1]], angle: 125.26, pts: [[0,1],[1,1],[0.5,1+H]] },
      { id: 'l', parent: 'B', hinge: [[0,0],[0,1]], angle: 125.26, pts: [[0,0],[0,1],[-H,0.5]] },
      { id: 'r', parent: 'B', hinge: [[1,0],[1,1]], angle: 125.26, pts: [[1,0],[1,1],[1+H,0.5]] },
    ]
  },
  prism: {
    name: '삼각기둥', F: 5, E: 9, V: 6,
    desc: '밑면이 삼각형 2개, 옆면이 직사각형 3개예요. 텐트나 초콜릿 상자 모양을 떠올려 보세요.',
    faces: [
      { id: 'B', pts: [[0,0],[1,0],[1,1.6],[0,1.6]] },
      { id: 'L', parent: 'B', hinge: [[0,0],[0,1.6]], angle: 120, pts: [[-1,0],[0,0],[0,1.6],[-1,1.6]] },
      { id: 'R', parent: 'B', hinge: [[1,0],[1,1.6]], angle: 120, pts: [[1,0],[2,0],[2,1.6],[1,1.6]] },
      { id: 'd', parent: 'B', hinge: [[0,0],[1,0]], angle: 90, pts: [[0,0],[1,0],[0.5,-H]] },
      { id: 'u', parent: 'B', hinge: [[0,1.6],[1,1.6]], angle: 90, pts: [[0,1.6],[1,1.6],[0.5,1.6+H]] },
    ]
  },
};

const COLORS = ['#ff8a65','#ffd54f','#81c784','#64b5f6','#ba68c8','#4dd0e1'];

// 경첩 회전 준비: 면의 무게중심이 위(+z)로 올라오도록 축 방향을 정함
for (const s of Object.values(SHAPES)) {
  const byId = {};
  s.faces.forEach((f, i) => { byId[f.id] = f; f.color = COLORS[i % COLORS.length]; });
  for (const f of s.faces) {
    f.parentFace = f.parent ? byId[f.parent] : null;
    if (!f.hinge) continue;
    const [a, b] = f.hinge;
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    const cx = f.pts.reduce((t, p) => t + p[0], 0) / f.pts.length - a[0];
    const cy = f.pts.reduce((t, p) => t + p[1], 0) / f.pts.length - a[1];
    if (dx * cy - dy * cx < 0) { dx = -dx; dy = -dy; }
    f.axis = { a: [a[0], a[1], 0], d: [dx, dy, 0] };
  }
  let ext = 0;
  const xs = s.faces.flatMap(f => f.pts.map(p => p[0])), ys = s.faces.flatMap(f => f.pts.map(p => p[1]));
  ext = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  s.extent = ext;
}

function rotate(v, axis, phi) {
  const [ax, ay, az] = axis.a, [dx, dy, dz] = axis.d;
  const rx = v[0] - ax, ry = v[1] - ay, rz = v[2] - az;
  const c = Math.cos(phi), s = Math.sin(phi);
  const dot = dx * rx + dy * ry + dz * rz;
  const cxp = dy * rz - dz * ry, cyp = dz * rx - dx * rz, czp = dx * ry - dy * rx;
  return [
    ax + rx * c + cxp * s + dx * dot * (1 - c),
    ay + ry * c + cyp * s + dy * dot * (1 - c),
    az + rz * c + czp * s + dz * dot * (1 - c),
  ];
}

// ---- 상태 ----
let key = 'cube', t = 0, target = 0, yaw = deg(-25), pitch = deg(-55), autoSpin = true;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const slider = document.getElementById('fold'), pct = document.getElementById('pct');
const playBtn = document.getElementById('play'), spinBtn = document.getElementById('spin');

function worldFaces(shape, k) {
  return shape.faces.map(f => {
    let pts = f.pts.map(p => [p[0], p[1], 0]);
    for (let g = f; g && g.axis; g = g.parentFace) {
      pts = pts.map(p => rotate(p, g.axis, deg(g.angle) * k));
    }
    return { pts, color: f.color };
  });
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const shape = SHAPES[key];
  const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const faces = worldFaces(shape, ease);
  const all = faces.flatMap(f => f.pts);
  const c = [0, 1, 2].map(i => all.reduce((s, p) => s + p[i], 0) / all.length);
  const scale = Math.min(w, h) * 0.62 / shape.extent * (1 + 0.7 * ease);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const D = 6;

  const view = p => {
    let x = p[0] - c[0], y = p[1] - c[1], z = p[2] - c[2];
    const x1 = x * cy - y * sy, y1 = x * sy + y * cy;
    const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
    return [x1, y2, z2];
  };

  const polys = faces.map(f => {
    const v = f.pts.map(view);
    const depth = v.reduce((s, p) => s + p[2], 0) / v.length;
    const u = [v[1][0]-v[0][0], v[1][1]-v[0][1], v[1][2]-v[0][2]];
    const q = [v[2][0]-v[0][0], v[2][1]-v[0][1], v[2][2]-v[0][2]];
    const n = [u[1]*q[2]-u[2]*q[1], u[2]*q[0]-u[0]*q[2], u[0]*q[1]-u[1]*q[0]];
    const nl = Math.hypot(...n) || 1;
    const light = 0.62 + 0.38 * Math.abs((n[0] * -0.3 + n[1] * 0.5 + n[2] * 0.81) / nl);
    const scr = v.map(p => { const k = D / (D - p[2]); return [w / 2 + p[0] * scale * k, h / 2 - p[1] * scale * k]; });
    return { scr, depth, color: f.color, light };
  }).sort((a, b) => a.depth - b.depth);

  const edge = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  for (const p of polys) {
    ctx.beginPath();
    p.scr.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.fillStyle = p.color; ctx.globalAlpha = 1; ctx.fill();
    ctx.fillStyle = '#000'; ctx.globalAlpha = 1 - p.light; ctx.fill();
    ctx.globalAlpha = 0.85; ctx.strokeStyle = edge; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function loop() {
  if (t !== target) {
    const step = 0.012;
    t = Math.abs(target - t) < step ? target : t + Math.sign(target - t) * step;
    syncUI();
  }
  if (autoSpin && !dragging) yaw += 0.006;
  draw();
  requestAnimationFrame(loop);
}

function syncUI() {
  slider.value = Math.round(t * 100);
  pct.textContent = Math.round(t * 100) + '%';
  playBtn.textContent = target > 0.5 ? '펼치기' : '접기';
}

// ---- 도형 선택 ----
const chips = document.getElementById('chips');
for (const [k, s] of Object.entries(SHAPES)) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = s.name; b.dataset.k = k;
  b.addEventListener('click', () => selectShape(k));
  chips.appendChild(b);
}
function selectShape(k) {
  key = k; t = 0; target = 0; yaw = deg(-25); pitch = deg(-55);
  chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  document.getElementById('desc').textContent = SHAPES[k].desc;
  document.querySelectorAll('.card .num').forEach(n => { n.textContent = '?'; n.classList.add('hidden'); });
  document.getElementById('euler').textContent = '카드를 눌러 정답을 확인해 보세요.';
  syncUI();
}

document.querySelectorAll('.card').forEach(card => card.addEventListener('click', () => {
  const n = card.querySelector('.num');
  n.textContent = SHAPES[key][card.dataset.k]; n.classList.remove('hidden');
  if ([...document.querySelectorAll('.card .num')].every(x => !x.classList.contains('hidden'))) {
    const s = SHAPES[key];
    document.getElementById('euler').textContent =
      `신기한 규칙: 꼭짓점 ${s.V} − 모서리 ${s.E} + 면 ${s.F} = ${s.V - s.E + s.F}`;
  }
}));

// ---- 조작 ----
playBtn.addEventListener('click', () => { target = target > 0.5 ? 0 : 1; syncUI(); });
slider.addEventListener('input', () => { t = target = slider.value / 100; syncUI(); });
spinBtn.addEventListener('click', () => { autoSpin = !autoSpin; spinBtn.textContent = autoSpin ? '자동 회전 켬' : '자동 회전 끔'; });

let dragging = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw += (e.clientX - lx) * 0.01;
  pitch = Math.max(deg(-80), Math.min(deg(80), pitch - (e.clientY - ly) * 0.01));
  lx = e.clientX; ly = e.clientY;
});
const stop = () => { dragging = false; };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);

selectShape('cube');
loop();
</script>
</body>
</html>
